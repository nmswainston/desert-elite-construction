[build]
  publish = "."

# ── Security headers (every response) ─────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ── Caching ───────────────────────────────────────────────────
# HTML/CSS/JS aren't fingerprinted, so always revalidate (ETag 304s are
# cheap). This keeps edits going live immediately, no stale styles/scripts.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images change rarely: cache 30 days for performance, but not "immutable"
# so a re-uploaded photo (same filename) still refreshes within a month.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ── Canonical URL form ────────────────────────────────────────
# Netlify serves both /about and /about.html with a 200, so every page
# has two live URLs. That splits analytics and gives Google two copies
# to reconcile. The canonical tags, sitemap.xml, and every internal link
# already use the .html form, so redirect the extensionless form to it.
#
# NOTE: this requires "Pretty URLs" (Project configuration > Build &
# deploy > Post processing) to stay OFF. That setting redirects the
# opposite direction and would create a loop with these rules.
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
