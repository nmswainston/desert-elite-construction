[build]
  publish = "."

# ── Security headers (every response) ─────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ── Caching ───────────────────────────────────────────────────
# HTML/CSS/JS aren't fingerprinted, so always revalidate (ETag 304s are
# cheap). This keeps edits going live immediately, no stale styles/scripts.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images change rarely: cache 30 days for performance, but not "immutable"
# so a re-uploaded photo (same filename) still refreshes within a month.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ── Canonical URL form ────────────────────────────────────────
# Netlify's Pretty URLs post-processing rewrites internal .html links to
# the extensionless form and serves them, so extensionless is the form
# visitors and crawlers actually see. Canonicals and sitemap.xml match it.
#
# These send the .html form to its extensionless twin so each page has one
# address instead of two. force = true is required because the .html file
# genuinely exists, and without it Netlify serves the file and skips the rule.
[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/projects.html"
  to = "/projects"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true
